name = "eshop"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "eshop-db"
database_id = "local-dev-db"
# For production, use actual database_id from: wrangler d1 create eshop-db

# Use vitest for local testing
[vars]
ENVIRONMENT = "development"
