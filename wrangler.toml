name = "eshop"
main = "src/api/index.ts"
compatibility_date = "2024-12-20"

# Development configuration
[env.development]
workers_dev = true

# Production configuration
[env.production]
workers_dev = false

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "eshop-db"
database_id = "local-dev-db"
# For production, use actual database_id from: wrangler d1 create eshop-db

# R2 bucket for PDF storage (placeholder)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "eshop-pdfs"

# Environment variables
[vars]
ENVIRONMENT = "development"
